name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smart_calc_test
          POSTGRES_USER: smart_calc
          POSTGRES_PASSWORD: smart_calc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_calc -d smart_calc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://smart_calc:smart_calc_test@127.0.0.1:5432/smart_calc_test
          STORAGE_DIR: /tmp/smart-calc-test-files
          PYTHONPATH: .
        run: pytest -q -s

      - name: Verify v1.0.42 rollback and quotation pixels
        shell: bash
        run: |
          git fetch --depth=1 origin tag v1.0.42
          git worktree add --detach ../smart-calc-rollback-baseline v1.0.42
          python scripts/check-rollback-compatibility.py --previous ../smart-calc-rollback-baseline

      - name: Validate database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://smart_calc:smart_calc_test@127.0.0.1:5432/smart_calc_test
        run: |
          alembic upgrade head
          alembic downgrade base

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate design tokens
        run: python scripts/build-design-tokens.py --check

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build offline design system
        working-directory: frontend
        run: npm run design-system:preview

      - name: Package offline design system
        run: python scripts/package-design-system.py --output-dir /tmp/smart-calc-design-system

      - name: Install quotation browser test dependencies
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps chromium

      - name: Test quotation editor in browser
        shell: bash
        env:
          NODE_PATH: frontend/node_modules
        run: |
          DATABASE_URL=sqlite:////tmp/quotation-browser.sqlite STORAGE_DIR=/tmp/quotation-browser-storage AUTO_CREATE_SCHEMA=1 PYTHONPATH=backend uvicorn app.main:app --host 127.0.0.1 --port 8014 >/tmp/quotation-api.log 2>&1 &
          npm run dev --prefix frontend -- --host 127.0.0.1 --port 5174 >/tmp/quotation-ui.log 2>&1 &
          python -m http.server 5175 --bind 127.0.0.1 --directory frontend/dist >/tmp/quotation-built-ui.log 2>&1 &
          python - <<'PY'
          import time,urllib.request
          for address in ('http://127.0.0.1:8014/api/health','http://127.0.0.1:5174','http://127.0.0.1:5175'):
              for attempt in range(60):
                  try:
                      urllib.request.urlopen(address,timeout=2).read()
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise RuntimeError('Test server did not become ready: '+address)
          PY
          node frontend/tests/design-system.cjs
          node frontend/tests/standalone-quotations.cjs
          node frontend/tests/quotations.cjs
          node frontend/tests/pdf-quotation-import.cjs
          node frontend/tests/search-and-scroll.cjs
          node frontend/tests/manual-tools.cjs
          node frontend/tests/frames.cjs
          node frontend/tests/power-supplies.cjs
          node frontend/tests/rooms.cjs
          node frontend/tests/pdf-import-settings.cjs
          node frontend/tests/workbench.cjs
          node frontend/tests/plan-drag.cjs
          node frontend/tests/workbench-next.cjs
          FRAME_TEST_FRONTEND=http://127.0.0.1:5175 node frontend/tests/project-workspace.cjs
          FRAME_TEST_FRONTEND=http://127.0.0.1:5175 node frontend/tests/inline-quote-products.cjs
          node frontend/tests/large-quotation.cjs
          node frontend/tests/quotation-workbench.cjs
          node frontend/tests/quotation-fields.cjs
          node frontend/tests/quotation-quick-fields.cjs
          node frontend/tests/quotation-diagnostic-links.cjs
          node frontend/tests/product-sku-search.cjs
          node frontend/tests/frame-products.cjs
          FRAME_TEST_FRONTEND=http://127.0.0.1:5175 node frontend/tests/frame-selection.cjs
          node frontend/tests/photos-categories.cjs
          node frontend/tests/plan-symbols-layers.cjs
          node frontend/tests/quotation-plan-quantities.cjs
          node frontend/tests/russian-errors.cjs
          node frontend/tests/sku-word.cjs
          node frontend/tests/quotation-room-layout.cjs
          node frontend/tests/quotation-grouping.cjs
          node frontend/tests/quote-plan-v65.cjs
          node frontend/tests/quotation-export-prices.cjs
          node frontend/tests/popup-drag-scroll.cjs
          node frontend/tests/audit-fixes.cjs
          node frontend/tests/visual-refresh.cjs
          node frontend/tests/catalog.cjs
          node frontend/tests/shared-catalog.cjs
          node frontend/tests/bulk-edit.cjs
          node frontend/tests/plan-products.cjs
          node frontend/tests/plan-product-dialog.cjs
          node frontend/tests/context-properties.cjs
          node frontend/tests/plan-label-bounds.cjs
          node frontend/tests/new-plan-supplies.cjs

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate maintenance scripts
        shell: bash
        run: |
          sh -n backup/backup.sh
          sh -n scripts/restore-backup.sh
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/restore-backup.ps1",[ref]$tokens,[ref]$errors) | Out-Null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'

      - name: Build Docker images
        run: docker compose build

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
          cache: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build standalone Windows application
        shell: pwsh
        run: ./packaging/build-windows-exe.ps1

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SmartHomeCalc-Windows-x64
          path: |
            release/SmartHomeCalc-Windows-x64.exe
            release/SmartHomeCalc-Windows-x64.exe.sha256
          retention-days: 14
