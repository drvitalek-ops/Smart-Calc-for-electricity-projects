name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smart_calc_test
          POSTGRES_USER: smart_calc
          POSTGRES_PASSWORD: smart_calc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_calc -d smart_calc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
          cache: false

      - name: Build Windows EXE
        run: ./packaging/build-windows-exe.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SmartHomeCalc-Windows-x64
          path: |
            release/SmartHomeCalc-Windows-x64.exe
            release/SmartHomeCalc-Windows-x64.exe.sha256
          retention-days: 14

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://smart_calc:smart_calc_test@127.0.0.1:5432/smart_calc_test
          STORAGE_DIR: /tmp/smart-calc-test-files
          PYTHONPATH: .
        run: pytest -q

      - name: Validate database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://smart_calc:smart_calc_test@127.0.0.1:5432/smart_calc_test
        run: |
          alembic upgrade head
          alembic downgrade base

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate maintenance scripts
        shell: bash
        run: |
          sh -n backup/backup.sh
          sh -n scripts/restore-backup.sh
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/restore-backup.ps1",[ref]$tokens,[ref]$errors) | Out-Null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'

      - name: Build Docker images
        run: docker compose build
