name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
          cache: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build standalone Windows application
        shell: pwsh
        run: ./packaging/build-windows-exe.ps1

      - name: Verify checksum
        working-directory: release
        shell: pwsh
        run: |
          $expected = (Get-Content SmartHomeCalc-Windows-x64.exe.sha256).Split(' ')[0]
          $actual = (Get-FileHash SmartHomeCalc-Windows-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA-256 mismatch" }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/SmartHomeCalc-Windows-x64.exe
          release/SmartHomeCalc-Windows-x64.exe.sha256
          --repo "$GITHUB_REPOSITORY"
          --title "Smart Home Calc $GITHUB_REF_NAME"
          --notes "Автономное офлайн-приложение Smart Home Calc для Windows x64. Docker и PostgreSQL устанавливать не требуется."
