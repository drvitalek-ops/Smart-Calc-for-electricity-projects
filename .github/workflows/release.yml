name: Windows release

on:
  push:
    tags:
      - 'v*'
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
          cache: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build standalone Windows application
        shell: pwsh
        run: ./packaging/build-windows-exe.ps1

      - name: Verify checksum
        working-directory: release
        shell: pwsh
        run: |
          $expected = (Get-Content SmartHomeCalc-Windows-x64.exe.sha256).Split(' ')[0]
          $actual = (Get-FileHash SmartHomeCalc-Windows-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA-256 mismatch" }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $match = Select-String -Path backend/app/main.py -Pattern "APP_VERSION = '(?<version>[^']+)'"
          $releaseTag = "v" + $match.Matches[0].Groups["version"].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $releaseTag) {
            throw "Release tag does not match application version"
          }
          $releaseNotes = "docs/$releaseTag.md"
          if (-not (Test-Path $releaseNotes)) {
            $releaseNotes = "release/release-notes.md"
            [IO.File]::WriteAllText($releaseNotes, "Автономное офлайн-приложение Smart Home Calc для Windows x64. Docker и PostgreSQL устанавливать не требуется.", [Text.UTF8Encoding]::new($false))
          }
          gh release create $releaseTag `
            release/SmartHomeCalc-Windows-x64.exe `
            release/SmartHomeCalc-Windows-x64.exe.sha256 `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:RELEASE_COMMIT `
            --title "Smart Home Calc $releaseTag" `
            --notes-file $releaseNotes
